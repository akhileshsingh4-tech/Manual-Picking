<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HHD Picking Tool</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#252540;--accent:#4f8ef7;--accent2:#00d4aa;--warn:#f7a34f;--danger:#f75f5f;--success:#4fd97e;--text:#e8e8f0;--muted:#8888aa;--border:#2a2a45;--radius:14px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.screen{display:none;width:100%;max-width:480px;padding:24px 20px;flex-direction:column;gap:20px}
.screen.active{display:flex}
.logo{text-align:center;padding:32px 0 8px}
.logo .icon{width:72px;height:72px;background:linear-gradient(135deg,#4f8ef7 0%,#00d4aa 100%);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:12px}
.logo h1{font-size:22px;font-weight:700}
.logo p{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
input[type="text"]{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:20px;padding:14px 16px;outline:none;transition:border-color 0.2s;font-weight:600;letter-spacing:1px}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:16px;border-radius:12px;border:none;font-size:17px;font-weight:700;cursor:pointer;transition:opacity 0.15s,transform 0.1s}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:var(--surface2);color:var(--text)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.progress-wrap{background:var(--surface2);border-radius:8px;height:10px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px;transition:width 0.5s ease}
.progress-info{display:flex;justify-content:space-between;align-items:center}
.progress-info span{font-size:13px;color:var(--muted)}
.progress-info strong{font-size:18px;font-weight:700;color:var(--accent2)}
.pick-card{background:var(--surface2);border:2px solid var(--accent);border-radius:var(--radius);padding:24px 20px;text-align:center;position:relative;overflow:hidden}
.pick-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pick-seq{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.pick-location{background:var(--bg);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.loc-icon{font-size:28px}.loc-text{text-align:left}
.loc-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.loc-val{font-size:26px;font-weight:800;color:var(--warn);letter-spacing:2px;font-family:'Courier New',monospace}
.pick-wsn-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.pick-wsn-val{font-size:32px;font-weight:900;color:var(--text);letter-spacing:3px;font-family:'Courier New',monospace;margin-bottom:16px}
.scan-wrap{position:relative}
.scan-wrap input{padding-right:52px;font-family:'Courier New',monospace}
.scan-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--accent);border:none;border-radius:8px;width:40px;height:40px;font-size:20px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center}
.alert{padding:14px 16px;border-radius:10px;font-size:14px;font-weight:600;display:none;align-items:center;gap:10px}
.alert.show{display:flex}
.alert-error{background:rgba(247,95,95,0.15);border:1px solid var(--danger);color:var(--danger)}
.alert-warn{background:rgba(247,163,79,0.15);border:1px solid var(--warn);color:var(--warn)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip strong{color:var(--text);font-size:14px}
.done-anim{font-size:72px;text-align:center;padding:24px 0 12px;animation:pop 0.5s cubic-bezier(0.2,1.5,0.5,1)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.done-title{font-size:26px;font-weight:800;text-align:center}
.done-sub{font-size:14px;color:var(--muted);text-align:center}
.divider{height:1px;background:var(--border)}
.gen-info{font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="screen active" id="screen-login">
  <div class="logo">
    <div class="icon">&#128230;</div>
    <h1>HHD Picking Tool</h1>
    <p>RC Lite - Manual Picking</p>
  </div>
  <div class="card">
    <label for="empInput">Employee ID</label>
    <input type="text" id="empInput" placeholder="Enter Employee ID" autocomplete="off" spellcheck="false">
  </div>
  <div class="alert alert-error" id="loginAlert"><span>&#9888;</span><span id="loginAlertMsg"></span></div>
  <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Start Picking Session</button>
  <p class="gen-info">Last updated: 4/11/2026, 10:04:59 am</p>
</div>

<div class="screen" id="screen-pick">
  <div class="chips">
    <div class="chip">&#128100; <strong id="chipEmp">-</strong></div>
    <div class="chip">&#10003; <strong id="chipPicked">0</strong> picked</div>
  </div>
  <div>
    <div class="progress-info" style="margin-bottom:8px">
      <span>Progress</span><strong id="progressLabel">0 / 0</strong>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  </div>
  <div class="pick-card" id="pickCard">
    <div class="pick-seq" id="pickSeq">ITEM 1 OF 0</div>
    <div class="pick-location">
      <div class="loc-icon">&#128205;</div>
      <div class="loc-text">
        <div class="loc-label">Go to location</div>
        <div class="loc-val" id="pickLocation">-</div>
      </div>
    </div>
    <div class="pick-wsn-label">Scan or type WSN</div>
    <div class="pick-wsn-val" id="pickWSN">-</div>
    <div class="scan-wrap">
      <input type="text" id="scanInput" placeholder="Scan WSN here..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')confirmScan()">
      <button class="scan-btn" onclick="confirmScan()">&#8594;</button>
    </div>
  </div>
  <div class="alert" id="pickAlert"><span id="pickAlertIcon">&#9888;</span><span id="pickAlertMsg"></span></div>
  <button class="btn btn-ghost" onclick="skipWSN()" style="font-size:14px;padding:12px">Skip this WSN (flag for review)</button>
</div>

<div class="screen" id="screen-done">
  <div class="done-anim">&#10024;</div>
  <div class="done-title">All WSNs Picked!</div>
  <div class="done-sub" id="doneSub">Session complete</div>
  <div class="divider"></div>
  <div class="card" id="doneStats"></div>
  <button class="btn btn-primary" onclick="resetApp()">Start New Session</button>
</div>

<script>
const DB = {"3358937":[{"wsn":"3ETAWN_D","location":"GRD1002C1"},{"wsn":"3EAL1D_H","location":"GRD1004B1"},{"wsn":"3CALOH_R","location":"GRD1009D3"},{"wsn":"3CN4FL_L","location":"GRD1009D3"},{"wsn":"3CCR3J_X","location":"GRD1009D3"},{"wsn":"3DKJ3N_N","location":"GRD1009D4"},{"wsn":"3C7XHE_X","location":"GRD1014B1"},{"wsn":"3D6ALR_J","location":"GRD1014D8"},{"wsn":"3BWDBX_V","location":"GRD1017B1"},{"wsn":"3D30B6_N","location":"GRD1019C1"},{"wsn":"37KILY_V","location":"GRD1019D3"},{"wsn":"3D5FS6_T","location":"GRD1021D3"},{"wsn":"3DIJWW_R","location":"GRD1021D3"},{"wsn":"3BTANK_D","location":"GRD1022B1"},{"wsn":"3D2CL4_T","location":"GRD1022D7"},{"wsn":"3DXG1I_Z","location":"GRD1022D7"},{"wsn":"3CARAL_L","location":"GRD1022D7"},{"wsn":"3CRC6A_T","location":"GRD1023D7"},{"wsn":"3CRVJC_P","location":"GRD1023D7"},{"wsn":"3CLZST_V","location":"GRD1026C7"},{"wsn":"3DVJZ3_Z","location":"GRD1029D3"},{"wsn":"3BU2PN_F","location":"GRD1030C7"},{"wsn":"3DK0FJ_T","location":"GRD1030D5"},{"wsn":"3DXIR0_P","location":"GRD1030D5"},{"wsn":"3CDKMJ_Z","location":"GRD1031D7"},{"wsn":"3CDDMY_R","location":"GRD1034C7"},{"wsn":"3DKS25_N","location":"GRD1034D4"},{"wsn":"3BX3ZO_Z","location":"GRD1035C8"},{"wsn":"3D4Q7Z_L","location":"GRD1036C1"},{"wsn":"3EEV1Z_L","location":"GRD1036D7"},{"wsn":"3C9DYC_V","location":"GRD1038B1"},{"wsn":"3DHY3X_V","location":"GRD1038C2"},{"wsn":"3D3BRO_N","location":"GRD1038C6"},{"wsn":"3DYB2C_T","location":"GRD1038C8"},{"wsn":"3CO8SU_T","location":"GRD1039C7"},{"wsn":"3CAO2Z_D","location":"GRD1039C8"},{"wsn":"379P0C_N","location":"GRD1040B1"},{"wsn":"3COGEO_L","location":"GRD1040D4"},{"wsn":"3DIJI0_N","location":"GRD1040D8"},{"wsn":"3D2AWH_H","location":"GRD1041C1"},{"wsn":"3CBMWV_D","location":"GRD1046D6"},{"wsn":"39QFRX_B","location":"GRD1047D7"},{"wsn":"394H6T_V","location":"GRD1047D7"},{"wsn":"3DKJ5W_H","location":"GRD1104B1"},{"wsn":"3EF8GP_X","location":"GRD1104D2"},{"wsn":"3DYQOG_N","location":"GRD1106D5"},{"wsn":"3COKQS_V","location":"GRD1108C1"},{"wsn":"3CR2M7_B","location":"GRD1118D2"},{"wsn":"396OT5_N","location":"GRD1119D3"},{"wsn":"3DLB4L_B","location":"GRD1119D3"},{"wsn":"3CCGZY_H","location":"GRD1119D6"},{"wsn":"3C8HQV_R","location":"GRD1119D7"},{"wsn":"3DJJ8K_R","location":"GRD1120E7"},{"wsn":"3CD0X7_V","location":"GRD1122C1"},{"wsn":"3ECAMP_D","location":"GRD1122D2"},{"wsn":"3CAF4F_Z","location":"GRD1122D3"},{"wsn":"3CSR93_R","location":"GRD1122D3"},{"wsn":"389R9B_H","location":"GRD1122E6"},{"wsn":"3BTC97_N","location":"GRD1123D2"},{"wsn":"3CAR6U_L","location":"GRD1126D5"},{"wsn":"3CRXZG_D","location":"GRD1128B1"},{"wsn":"3CU6OF_T","location":"GRD1128B1"},{"wsn":"3D3NEZ_N","location":"GRD1131E3"},{"wsn":"3DYFI9_H","location":"GRD1135E2"},{"wsn":"3DIW8R_D","location":"GRD1137C1"},{"wsn":"3DWFW6_X","location":"GRD1139B1"},{"wsn":"3BSB26_X","location":"GRD1139B1"},{"wsn":"3CCF82_H","location":"GRD1139C2"},{"wsn":"3BC6LA_L","location":"GRD1141D3"},{"wsn":"3BRIMK_N","location":"GRD1141D3"},{"wsn":"3D1UTH_V","location":"GRD1141D6"},{"wsn":"3ET10F_R","location":"GRD1142B1"},{"wsn":"3CDL7D_F","location":"GRD1143B1"},{"wsn":"3AC44Q_Z","location":"GRD1144D3"},{"wsn":"3BUA6L_N","location":"GRD1145B1"},{"wsn":"3CRGGP_F","location":"GRD1145C6"},{"wsn":"3EVOQO_H","location":"GRD1145D3"},{"wsn":"3CE1BF_D","location":"GRD1146D6"},{"wsn":"3BSDNQ_P","location":"GRD1149D7"},{"wsn":"3CCPMT_B","location":"GRD1151C1"},{"wsn":"3DWC4Y_B","location":"GRD1151D3"},{"wsn":"3CQPDP_Z","location":"GRD1152B1"},{"wsn":"3CQA21_P","location":"GRD1154B1"},{"wsn":"3CD98V_D","location":"GRD1154D8"},{"wsn":"3CQKE4_Z","location":"GRD1156B1"},{"wsn":"396AJR_Z","location":"GRD1157B1"},{"wsn":"3DJRD3_B","location":"GRD1157C7"},{"wsn":"3CB2FK_V","location":"GRD1157C8"},{"wsn":"3ABRJN_B","location":"GRD1158B1"},{"wsn":"3DV5Z9_N","location":"GRD1158D3"},{"wsn":"3BTQ9R_T","location":"GRD1159B1"},{"wsn":"3CL6XH_R","location":"GRD1159C3"},{"wsn":"3EBJZ3_J","location":"GRD1160C3"},{"wsn":"3D4RWT_V","location":"GRD1160C4"},{"wsn":"3DK6SG_X","location":"GRD1161C2"},{"wsn":"3D10UY_N","location":"GRD1161C5"},{"wsn":"3DIC5H_L","location":"GRD1162C2"},{"wsn":"39YZVZ_H","location":"GRD1162C6"},{"wsn":"3BUJF8_X","location":"GRD1162C7"},{"wsn":"39NUEU_Z","location":"GRD1164B1"},{"wsn":"3DZ9ZB_D","location":"GRD1164D1"},{"wsn":"3CDT0V_B","location":"GRD1164D3"},{"wsn":"3EATEK_J","location":"GRD1164D3"},{"wsn":"3D49S2_P","location":"GRD1164D3"},{"wsn":"3COCHN_N","location":"GRD1164D8"},{"wsn":"3966ZD_H","location":"GRD1165C7"},{"wsn":"3ES5UE_F","location":"GRD1166D6"},{"wsn":"3D6LZF_B","location":"GRD1170B1"},{"wsn":"3EFEYR_R","location":"GRD1170D2"},{"wsn":"3DXQ9R_D","location":"GRD1170D2"},{"wsn":"3CBILO_P","location":"GRD1171C4"},{"wsn":"3D2SDD_H","location":"GRD1171C5"},{"wsn":"3F7XMY_P","location":"GRD1178D5"},{"wsn":"3CQPLE_N","location":"GRD1179D1"},{"wsn":"3DHVQA_T","location":"GRD1179D3"},{"wsn":"3DK2V7_D","location":"GRD1179D6"},{"wsn":"3BQV6D_J","location":"GRD1180D2"},{"wsn":"3DI7TW_R","location":"GRD1180D7"}]};
let picked = {};
let state = {empId:'',total:0,pickedCount:0,currentWSN:'',currentLocation:'',startTime:null,skipped:[],pickedList:[]};

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active')}
function showAlert(elId,msg,type){const el=document.getElementById(elId);el.className='alert alert-'+type+' show';if(elId==='pickAlert'){document.getElementById('pickAlertIcon').textContent=type==='error'?'X':'!';document.getElementById('pickAlertMsg').textContent=msg}else{document.getElementById(elId+'Msg').textContent=msg}}
function hideAlert(elId){document.getElementById(elId).classList.remove('show')}
function updateProgress(){const pct=state.total>0?(state.pickedCount/state.total*100):0;document.getElementById('progressBar').style.width=pct+'%';document.getElementById('progressLabel').textContent=state.pickedCount+' / '+state.total;document.getElementById('chipPicked').textContent=state.pickedCount}

function doLogin(){
  const empId=document.getElementById('empInput').value.trim();
  if(!empId){showAlert('loginAlert','Please enter your Employee ID','error');return}
  const list=DB[empId];
  if(!list||list.length===0){showAlert('loginAlert','No WSNs assigned to Employee: '+empId,'error');return}
  hideAlert('loginAlert');
  state={empId,total:list.length,pickedCount:0,currentWSN:'',currentLocation:'',startTime:Date.now(),skipped:[],pickedList:[]};
  picked={};
  document.getElementById('chipEmp').textContent=empId;
  updateProgress();
  showScreen('pick');
  loadNext();
}

function loadNext(){
  const list=DB[state.empId];
  const next=list.find(i=>!picked[i.wsn]);
  if(!next){showDone();return}
  state.currentWSN=next.wsn;
  state.currentLocation=next.location;
  document.getElementById('pickLocation').textContent=next.location;
  document.getElementById('pickWSN').textContent=next.wsn;
  document.getElementById('pickSeq').textContent='ITEM '+(state.pickedCount+1)+' OF '+state.total;
  document.getElementById('scanInput').value='';
  document.getElementById('scanInput').focus();
  hideAlert('pickAlert');
}

function confirmScan(){
  const scanned=document.getElementById('scanInput').value.trim().toUpperCase();
  const expected=state.currentWSN.toUpperCase();
  if(!scanned){showAlert('pickAlert','Please scan or enter the WSN','warn');return}
  if(scanned!==expected){showAlert('pickAlert','Wrong WSN! Expected: '+state.currentWSN,'error');document.getElementById('scanInput').value='';document.getElementById('scanInput').focus();return}
  picked[state.currentWSN]=true;
  state.pickedCount++;
  state.pickedList.push({wsn:state.currentWSN,location:state.currentLocation,time:new Date().toLocaleTimeString('en-IN')});
  updateProgress();
  loadNext();
}

function skipWSN(){
  if(!confirm('Skip WSN: '+state.currentWSN+'?\nThis will be flagged for review.'))return;
  state.skipped.push({wsn:state.currentWSN,location:state.currentLocation});
  picked[state.currentWSN]='skipped';
  loadNext();
}

function showDone(){
  const elapsed=Math.round((Date.now()-state.startTime)/1000);
  const mins=Math.floor(elapsed/60),secs=elapsed%60;
  document.getElementById('doneSub').textContent='Employee: '+state.empId;
  let rows=state.pickedList.map(p=>'<tr><td style="padding:4px 8px;font-family:monospace;font-size:12px">'+p.wsn+'</td><td style="padding:4px 8px;font-size:12px">'+p.location+'</td><td style="padding:4px 8px;font-size:12px;color:var(--muted)">'+p.time+'</td></tr>').join('');
  document.getElementById('doneStats').innerHTML=
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;margin-bottom:16px">'+
    '<div><div style="font-size:32px;font-weight:800;color:var(--success)">'+state.pickedCount+'</div><div style="font-size:12px;color:var(--muted)">WSNs Picked</div></div>'+
    '<div><div style="font-size:32px;font-weight:800;color:var(--accent)">'+mins+'m '+secs+'s</div><div style="font-size:12px;color:var(--muted)">Time Taken</div></div>'+
    (state.skipped.length>0?'<div style="grid-column:1/-1"><div style="font-size:24px;font-weight:800;color:var(--warn)">'+state.skipped.length+'</div><div style="font-size:12px;color:var(--muted)">Skipped</div></div>':'')+
    '</div>'+
    '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><tr style="color:var(--muted)"><th style="padding:4px 8px;text-align:left;font-size:11px">WSN</th><th style="padding:4px 8px;text-align:left;font-size:11px">Location</th><th style="padding:4px 8px;text-align:left;font-size:11px">Time</th></tr>'+rows+'</table></div>';
  showScreen('done');
  setTimeout(()=>alert('PICKING COMPLETE!\n\nEmployee: '+state.empId+'\nPicked: '+state.pickedCount+' WSNs\nTime: '+mins+'m '+secs+'s'),400);
}

function resetApp(){
  state={empId:'',total:0,pickedCount:0,currentWSN:'',currentLocation:'',startTime:null,skipped:[],pickedList:[]};
  picked={};
  document.getElementById('empInput').value='';
  hideAlert('loginAlert');
  showScreen('login');
}

document.getElementById('empInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
